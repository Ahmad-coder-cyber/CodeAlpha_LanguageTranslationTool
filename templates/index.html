<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Language Translation Tool</title>
  <style>
    :root {
      --bg: #f4f6fb; --card: #ffffff; --ink: #1f2937; --muted: #6b7280;
      --brand: #4f46e5; --brand-dark: #4338ca; --line: #e5e7eb; --err: #dc2626;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex; justify-content: center; padding: 32px 16px;
    }
    .wrap { width: 100%; max-width: 920px; }
    h1 { margin: 0 0 4px; font-size: 1.7rem; }
    .sub { margin: 0 0 24px; color: var(--muted); }
    .card {
      background: var(--card); border: 1px solid var(--line); border-radius: 14px;
      padding: 20px; box-shadow: 0 1px 3px rgba(0,0,0,.05);
    }
    .grid { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: center; }
    select, textarea {
      width: 100%; font: inherit; color: inherit; background: #fff;
      border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
    }
    select:focus, textarea:focus { outline: 2px solid var(--brand); border-color: transparent; }
    .panes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
    textarea { min-height: 220px; resize: vertical; line-height: 1.5; }
    #output { background: #f9fafb; }
    .row { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; gap: 8px; flex-wrap: wrap; }
    .count { color: var(--muted); font-size: .85rem; }
    button {
      font: inherit; cursor: pointer; border-radius: 10px; border: 1px solid var(--line);
      background: #fff; color: var(--ink); padding: 8px 14px;
    }
    button:hover:not(:disabled) { background: #f3f4f6; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .primary { background: var(--brand); border-color: var(--brand); color: #fff; font-weight: 600; padding: 10px 22px; }
    .primary:hover:not(:disabled) { background: var(--brand-dark); }
    .swap { width: 42px; height: 42px; padding: 0; font-size: 1.1rem; }
    .actions { display: flex; gap: 8px; }
    .bar { margin-top: 16px; display: flex; justify-content: center; }
    #status { text-align: center; min-height: 1.4em; margin-top: 12px; font-size: .9rem; color: var(--muted); }
    #status.error { color: var(--err); }
    @media (max-width: 640px) {
      .grid, .panes { grid-template-columns: 1fr; }
      .swap { justify-self: center; transform: rotate(90deg); }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Language Translation Tool</h1>
    <p class="sub">Type or paste text, choose the languages, and translate.</p>

    <div class="card">
      <div class="grid">
        <select id="source" aria-label="Source language">
          {% for code, name in languages.items() %}
            <option value="{{ code }}" {% if code == 'auto' %}selected{% endif %}>{{ name }}</option>
          {% endfor %}
        </select>
        <button class="swap" id="swap" title="Swap languages" aria-label="Swap languages">&#8644;</button>
        <select id="target" aria-label="Target language">
          {% for code, name in languages.items() if code != 'auto' %}
            <option value="{{ code }}" {% if code == 'ur' %}selected{% endif %}>{{ name }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="panes">
        <div>
          <textarea id="input" placeholder="Enter text here..." maxlength="5000"></textarea>
          <div class="row"><span class="count" id="count">0 / 5000</span></div>
        </div>
        <div>
          <textarea id="output" placeholder="Translation will appear here..." readonly></textarea>
          <div class="row">
            <span class="count" id="detected"></span>
            <div class="actions">
              <button id="copy" disabled>Copy</button>
              <button id="speak" disabled>Speak</button>
            </div>
          </div>
        </div>
      </div>

      <div class="bar"><button class="primary" id="go">Translate</button></div>
      <div id="status" role="status"></div>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const input = $("input"), output = $("output"), statusEl = $("status");
    const sourceSel = $("source"), targetSel = $("target");
    const goBtn = $("go"), copyBtn = $("copy"), speakBtn = $("speak");

    function setStatus(msg, isError = false) {
      statusEl.textContent = msg;
      statusEl.classList.toggle("error", isError);
    }

    input.addEventListener("input", () => {
      $("count").textContent = input.value.length + " / 5000";
    });

    // Ctrl/Cmd + Enter translates
    input.addEventListener("keydown", (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === "Enter") goBtn.click();
    });

    goBtn.addEventListener("click", async () => {
      const text = input.value.trim();
      if (!text) { setStatus("Please enter some text first.", true); return; }

      goBtn.disabled = true;
      setStatus("Translating...");
      try {
        const res = await fetch("/translate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text, source: sourceSel.value, target: targetSel.value }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Something went wrong.");
        output.value = data.translation;
        copyBtn.disabled = speakBtn.disabled = !data.translation;
        setStatus("Done.");
      } catch (err) {
        setStatus(err.message, true);
      } finally {
        goBtn.disabled = false;
      }
    });

    $("swap").addEventListener("click", () => {
      if (sourceSel.value === "auto") { setStatus("Pick a specific source language to swap.", true); return; }
      [sourceSel.value, targetSel.value] = [targetSel.value, sourceSel.value];
      if (output.value) { input.value = output.value; output.value = ""; copyBtn.disabled = speakBtn.disabled = true; }
      input.dispatchEvent(new Event("input"));
      setStatus("");
    });

    copyBtn.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(output.value);
      } catch (e) {
        output.select(); document.execCommand("copy");
      }
      const old = copyBtn.textContent;
      copyBtn.textContent = "Copied!";
      setTimeout(() => (copyBtn.textContent = old), 1200);
    });

    // Text-to-speech uses the browser's built-in Web Speech API (no library needed).
    speakBtn.addEventListener("click", () => {
      if (!("speechSynthesis" in window)) { setStatus("Speech is not supported in this browser.", true); return; }
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(output.value);
      u.lang = targetSel.value;
      window.speechSynthesis.speak(u);
    });
  </script>
</body>
</html>
